services:
  postgres:
    image: postgres:18-alpine
    restart: "no"
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_DB: dexbotx_economy_test
      POSTGRES_USER: dexbotx_test
      POSTGRES_PASSWORD: dexbotx_test_password
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dexbotx_test -d dexbotx_economy_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    restart: "no"
    command: ["redis-server", "--appendonly", "no", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
